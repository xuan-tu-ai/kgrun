[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kgrun"
version = "0.1.0"
description = "Execute Python scripts seamlessly on Kaggle GPUs from local terminal"
authors = [
    { name = "Nguyen Xuan Tu" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaggle>=2.2.3"
]

[project.scripts]
kgrun = "kgrun.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kgrun*"]

